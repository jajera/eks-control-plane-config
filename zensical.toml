[project]
site_name = "Amazon EKS control plane parameters"
site_description = "What Amazon EKS control plane configuration changes, and what stays the same on clusters created before the feature."
site_url = "https://jajera.github.io/eks-control-plane-config/"
nav = [
  { "Overview" = "index.md" },
  { "Before this feature" = "prior.md" },
  { "Existing clusters" = "existing.md" },
  { "Parameters" = "parameters.md" },
  { "Scheduler and provisioner" = "layers.md" },
]
extra_css = ["stylesheets/site.css"]

[project.theme]
name = "patina"
custom_dir = "overrides"
language = "en"
favicon = "assets/favicon.png"
logo = "assets/favicon.svg"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
toc.permalink = true
zensical.extensions.glightbox = {}
